name: Build FB Reels Viewer APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'source-project.zip'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euxo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        shell: bash
        run: |
          set -euxo pipefail
          test -f source-project.zip
          mkdir -p app-source
          unzip -q source-project.zip -d app-source
          test -f app-source/settings.gradle
          test -f app-source/app/build.gradle
          JAVA_FILE=app-source/app/src/main/java/com/madzain/fbreelsviewerpro/MainActivity.java
          grep -q 'import android.graphics.drawable.GradientDrawable;' "$JAVA_FILE" || sed -i '/^import android.graphics.Color;$/a import android.graphics.drawable.GradientDrawable;' "$JAVA_FILE"

      - name: Build debug APK
        working-directory: app-source
        run: gradle assembleDebug --stacktrace

      - name: Verify APK
        run: test -s app-source/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FB-Reels-Viewer-Pro-APK
          path: app-source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
