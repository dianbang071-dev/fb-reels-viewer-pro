name: Build FB Reels Viewer APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'source-project.zip'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 'latest'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager tidak ditemukan di $ANDROID_HOME/cmdline-tools"
            find "$ANDROID_HOME" -maxdepth 5 -type f -name sdkmanager 2>/dev/null || true
            exit 1
          fi
          echo "Menggunakan: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail
          test -f source-project.zip
          mkdir -p app-source
          unzip -q source-project.zip -d app-source
          test -f app-source/settings.gradle
          test -f app-source/app/build.gradle
          echo "Project Android ditemukan."

      - name: Build debug APK
        working-directory: app-source
        run: gradle assembleDebug --stacktrace

      - name: Verify APK
        run: |
          test -s app-source/app/build/outputs/apk/debug/app-debug.apk
          ls -lh app-source/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: FB-Reels-Viewer-Pro-APK
          path: app-source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
