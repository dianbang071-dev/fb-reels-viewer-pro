name: Build FB Reels Viewer APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'source-project.zip'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract Android project
        run: |
          test -f source-project.zip
          mkdir -p app-source
          unzip -q source-project.zip -d app-source
          test -f app-source/settings.gradle
          test -f app-source/app/build.gradle
          find app-source -maxdepth 3 -type f

      - name: Build debug APK
        working-directory: app-source
        run: gradle assembleDebug --stacktrace

      - name: Verify APK
        run: |
          test -s app-source/app/build/outputs/apk/debug/app-debug.apk
          ls -lh app-source/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: FB-Reels-Viewer-Pro-APK
          path: app-source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
